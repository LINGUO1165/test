name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add public Supabase client settings
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.QUIZ_SUPABASE_FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.QUIZ_SUPABASE_ANON_KEY }}
        run: |
          node -e 'const fs=require("node:fs"); const url=process.env.SUPABASE_FUNCTION_URL; const key=process.env.SUPABASE_ANON_KEY; if(!url||!key) throw new Error("Set QUIZ_SUPABASE_FUNCTION_URL and QUIZ_SUPABASE_ANON_KEY in GitHub Actions secrets."); fs.writeFileSync("public/app-config.js", "window.QUIZ_CONFIG = "+JSON.stringify({supabaseFunctionUrl:url,supabaseAnonKey:key})+";\n");'
      - name: Prepare static files
        run: |
          touch public/.nojekyll
          cp public/index.html public/404.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
